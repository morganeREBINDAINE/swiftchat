---
# CI override — builds the test image with vendor baked in, no volume mounts
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-ci
    build:
      context: .
      target: frankenphp_test
    environment:
      APP_ENV: test
      APP_SECRET: ${APP_SECRET:-ci-insecure-secret-for-testing}
      SKIP_DB_WAIT: "1"

  worker:
    image: ${IMAGES_PREFIX:-}app-php-ci
    build:
      context: .
      target: frankenphp_test
    healthcheck:
      test: ["CMD", "php", "-r", "echo 1;"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    environment:
      APP_ENV: test
      APP_SECRET: ${APP_SECRET:-ci-insecure-secret-for-testing}
